services:

  db:
    image: postgres:17-alpine3.24
    container_name: postgres-dev
    restart: always
    environment:
      POSTGRES_PASSWORD: "12345678"
      POSTGRES_DB: "financial-db"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: