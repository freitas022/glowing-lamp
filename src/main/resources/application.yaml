spring:
  application:
    name: financial

  security:
    jwt:
      private-key-location: classpath:keys/private-key.pem
      public-key-location: classpath:keys/public-key.pem
      issuer: financial-api
      access-token-ttl: 5m

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:financial-db}
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: ${POSTGRES_PASSWORD:12345678}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false